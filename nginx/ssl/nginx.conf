events {
    worker_connections 4096;
}

http {
    upstream varinish_pool {
        hash $request_uri consistent; # same url always goes to the same Varnish

        server varnish1:6081;
        server varnish2:6081;
        server varnish3:6081;
    }

    server {
        listen 443 ssl http2;
        server_name localhost;
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        location / {
            proxy_pass http://varinish_pool;

            proxy_set_header Host $host; # orig host name
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s; # max time to connect to backend
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /healhz {
            access log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
