events {
    worker_connections 4096;
}

http {
    upstream varnish_pool {
        hash $request_uri consistent; # same url always goes to the same Varnish
        server varnish1:6081;
    }

    server {
        listen 443 ssl;
        server_name origin.imgstream.ru;

        ssl_certificate /etc/letsencrypt/live/imgstream.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/imgstream.ru/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        location / {
            proxy_pass http://varnish_pool;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /healhz {
            access_log off;
            return 200 'OK';
            add_header Content-Type "text/plain";
        }
    }
}
